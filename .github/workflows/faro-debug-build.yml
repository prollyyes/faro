name: Faro Debug Build

on:
  push:
    branches:
      - faro-design

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK pieces
        run: ./automation/iceraven/install-sdk.sh

      - name: Create version name
        run: echo "VERSION_NAME=$(git describe --tags HEAD 2>/dev/null || echo faro-dev)" >> $GITHUB_ENV

      - name: Patch on the fly (same as release CI)
        run: ./automation/iceraven/patch_android_components.sh

      - name: Build forkDebug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx7g"
        run: ./gradlew app:assembleForkDebug -PversionName=${{ env.VERSION_NAME }} --no-daemon --stacktrace

      - name: List APK outputs
        run: find . -name "*.apk" | sort

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: faro-${{ env.VERSION_NAME }}-arm64-debug
          path: "**/outputs/apk/forkDebug/*arm64*.apk"
          if-no-files-found: warn
          retention-days: 7

      - name: Upload armeabi debug APK
        uses: actions/upload-artifact@v4
        with:
          name: faro-${{ env.VERSION_NAME }}-armeabi-debug
          path: "**/outputs/apk/forkDebug/*armeabi*.apk"
          if-no-files-found: warn
          retention-days: 7
